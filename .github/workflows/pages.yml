name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types check-analysis.mjs
      - run: node --experimental-strip-types check.mjs
      - run: node --experimental-strip-types check-diabetes-api.mjs
      - run: node --experimental-strip-types check-retizero.mjs
      - run: npx tsc --noEmit
      - run: npm run build:pages
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - run: node check-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

